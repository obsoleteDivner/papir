[package]
name = "papir-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
pdf-writer = "0.15.0"
png = "0.18.1"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subsetter = "0.2.6"
ttf-parser = "0.25.1"
unicode-linebreak = "0.1.5"
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2"] }
